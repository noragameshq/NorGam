<body>
<div id="rotate-overlay">
    <div class="phone-icon">📱</div>
    <h2>Please Rotate!</h2>
</div>
<div id="app-layout">
    <header id="ui-header">
        <h1 class="logo">Nora <span>Blocks</span></h1>
        <div class="header-actions">
            <div class="level-badge">Level: <span id="level-text">1</span> / <span id="level-total">50</span></div>
            <button class="btn-round btn-info" id="btn-howto" title="How to Play">❓</button>
            <button class="btn-round" id="btn-sound" title="Toggle Sound">🔊</button>
        </div>
    </header>
    <div class="filters-container">
        <button class="filter-btn active" data-filter="all">All Themes 🔀</button>
        <button class="filter-btn" data-filter="numbers">Numbers 🔢</button>
        <button class="filter-btn" data-filter="animals">Animals 🐶</button>
        <button class="filter-btn" data-filter="vehicles">Vehicles 🚗</button>
        <button class="filter-btn" data-filter="space">Space 🚀</button>
        <button class="filter-btn" data-filter="objects">Objects 🏠</button>
    </div>
    <main id="workspace">
        <aside class="target-section">
            <div class="target-title" id="theme-display-title">Match This!</div>
            <div class="target-card" id="target-grid"></div>
        </aside>
        <section class="board-wrapper">
            <div class="alert-msg" id="alert-msg">Almost! Let's try again! ✨</div>
            <div class="main-board" id="play-grid"></div>
        </section>
        <aside class="palette-section">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1.5vmin;">
                <div class="color-block" data-color="R" style="background-color: var(--c-red);"></div>
                <div class="color-block" data-color="G" style="background-color: var(--c-green);"></div>
                <div class="color-block" data-color="B" style="background-color: var(--c-blue);"></div>
                <div class="color-block" data-color="Y" style="background-color: var(--c-yellow);"></div>
                <div class="color-block" data-color="O" style="background-color: var(--c-orange);"></div>
                <div class="color-block" data-color="P" style="background-color: var(--c-purple);"></div>
                <div class="color-block" data-color="K" style="background-color: var(--c-pink);"></div>
                <div class="color-block" data-color="C" style="background-color: var(--c-brown);"></div>
                <div class="color-block" data-color="D" style="background-color: var(--c-black);"></div>
                <div class="color-block" data-color="W" style="background-color: var(--c-white);"></div>
            </div>       
            <button class="btn-clear-all" id="btn-clear-all" title="Clear Board">🗑️</button>
            <button class="btn-check" id="btn-check">✔️</button>
        </aside>
    </main>
</div>
<div id="ghost-block" class="block-3d"></div>
<div id="howto-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>How to Play</h2>
        <video class="tutorial-video" autoplay loop muted playsinline>
            <source src="Assets/NoraBlocks.mp4" type="video/mp4">
        </video>
        <p style="font-family: 'Quicksand', sans-serif; font-weight: 600; color: var(--text-color);">
            Drag colored blocks to the wooden board to build the shape shown on the target card. You can build it anywhere on the board! Tap a block to remove it.
        </p>
        <button class="action-btn" id="btn-close-howto">Got it!</button>
    </div>
</div>
<div id="start-modal" class="modal-overlay fullscreen-overlay">
    <div style="text-align: center;">
        <svg viewBox="0 0 120 120" width="20vmin" height="20vmin" style="filter: drop-shadow(0 2vmin 1.5vmin rgba(0,0,0,0.2)); margin-bottom: 2vmin;">
            <rect x="25" y="65" width="30" height="30" rx="4" fill="#EF4444" stroke="#2D3748" stroke-width="4"/>
            <rect x="65" y="65" width="30" height="30" rx="4" fill="#3B82F6" stroke="#2D3748" stroke-width="4"/>
            <rect x="45" y="25" width="30" height="30" rx="4" fill="#EAB308" stroke="#2D3748" stroke-width="4"/>
        </svg>
        <h1 class="title-text-1">Nora</h1>
        <h1 class="title-text-2">Blocks!</h1>
        <button class="action-btn" id="btn-start">PLAY!</button>
    </div>
</div>
<div id="success-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h1 style="font-size: 6vmin; color: var(--c-green); margin: 0 0 2vmin 0;">Perfect Match! 🌟</h1>
        <button class="action-btn" id="btn-next-level">Next Level</button>
    </div>
</div>
