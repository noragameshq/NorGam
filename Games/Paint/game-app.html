<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nora Paint & Color</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-color: #2D3748;
            --bg-color: #F8FAFC;
            --panel-bg: #FFFFFF;
            --pink: #F472B6;
            --green: #34D399;
            --blue: #5CE1E6;
            --yellow: #FFDE59;
            --purple: #C084FC;
            --red: #F87171;
            --dark: #334155;
            --gray: #E2E8F0;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            font-family: 'Fredoka One', cursive;
            display: flex; flex-direction: column; align-items: center;
            height: 100dvh; overflow: hidden; touch-action: none;
            user-select: none; -webkit-user-select: none;
        }

        /* --- ZORUNLU YATAY MOD --- */
        #rotate-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 10000;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .phone-icon { font-size: 6vmin; margin-bottom: 2vmin; animation: rotatePhone 2s ease-in-out infinite; }
        @keyframes rotatePhone { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
        #rotate-overlay h2 { color: var(--pink); font-size: 4vmin; margin: 0 0 1vmin 0; text-shadow: 0.3vmin 0.3vmin 0 var(--border-color); }
        
        @media screen and (orientation: portrait) {
            #rotate-overlay { display: flex; }
            #app-layout { display: none !important; }
        }

        #app-layout { display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; }

        /* --- HEADER --- */
        #ui-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5vmin 3vmin; box-sizing: border-box; z-index: 50; }
        .logo { font-size: 3.2vmin; color: var(--purple); text-shadow: 0.3vmin 0.3vmin 0 var(--border-color); margin: 0; }
        .logo span { color: var(--yellow); }
        
        .header-actions { display: flex; gap: 2vmin; }
        .btn-action {
            font-family: 'Fredoka One', cursive; font-size: 1.8vmin; padding: 1.2vmin 3vmin;
            background: white; color: var(--border-color); border: 0.4vmin solid var(--border-color);
            border-radius: 3vmin; cursor: pointer; box-shadow: 0 0.5vmin 0 var(--border-color);
            display: flex; align-items: center; gap: 1vmin; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-action:active { transform: translateY(0.5vmin); box-shadow: 0 0 0 var(--border-color); }
        .btn-clear { background-color: var(--red); color: white; }
        .btn-save { background-color: var(--green); color: white; }

        /* --- WORKSPACE --- */
        #workspace { display: flex; flex-direction: row; flex-grow: 1; gap: 2.5vmin; padding: 0 3vmin 3vmin 3vmin; box-sizing: border-box; overflow: hidden; }

        /* Sol Kokpit */
       /* Sağdaki ve Soldaki Kokpitler */
        .side-panel {
            width: 17vmin; 
            background: var(--panel-bg); 
            border: 0.6vmin solid var(--border-color);
            border-radius: 3vmin; 
            box-shadow: 0 1vmin 2vmin rgba(0,0,0,0.05);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 1.5vmin 1vmin; 
            gap: 1.2vmin;
            box-sizing: border-box;
            
            /* EKLENEN KOD: İçerik çoksa aşağı kaydırmayı açar, yatay kaydırmayı gizler */
            overflow-y: auto; 
            overflow-x: hidden;
        }
        
        .section-label { font-size: 1.5vmin; color: #64748B; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        /* Boyut Seçici */
        .size-row { display: flex; gap: 1vmin; width: 100%; justify-content: center; }
        .size-btn {
            width: 4.5vmin; height: 4.5vmin; border-radius: 50%; border: 0.3vmin solid var(--gray);
            background: white; cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s; padding: 0;
        }
        .size-btn.active { border-color: var(--border-color); transform: scale(1.15); box-shadow: 0 0.4vmin 0 var(--border-color); }
        .size-btn .dot { background: var(--dark); border-radius: 50%; }
        .size-sm .dot { width: 1.2vmin; height: 1.2vmin; }
        .size-md .dot { width: 2.2vmin; height: 2.2vmin; }
        .size-lg .dot { width: 3.2vmin; height: 3.2vmin; }

        /* Fırça Efekt Butonları */
        .effect-btn {
            width: 92%; padding: 1.5vmin; border-radius: 1.5vmin; border: 0.3vmin solid var(--gray);
            background: white; font-family: 'Fredoka One', cursive; font-size: 1.8vmin; color: var(--dark);
            display: flex; align-items: center; gap: 1vmin; cursor: pointer; transition: all 0.2s;
            box-sizing: border-box; text-align: left;
        }
        .effect-btn.active {
            border-color: var(--border-color); background: var(--yellow);
            color: var(--border-color); transform: scale(1.05); box-shadow: 0 0.5vmin 0 var(--border-color);
        }

        /* Navigasyon Okları */
        .nav-arrows {
            display: flex; gap: 1vmin; width: 92%; justify-content: space-between;
        }
        .nav-btn {
            flex: 1; padding: 1.5vmin 0; border-radius: 1.5vmin; border: 0.3vmin solid var(--gray);
            background: var(--bg-color); color: var(--dark); font-size: 2.5vmin; cursor: pointer;
            transition: all 0.2s; box-sizing: border-box; display: flex; justify-content: center; align-items: center;
        }
        .nav-btn:active { transform: scale(0.95); background: var(--gray); border-color: var(--border-color); }

        .divider { width: 80%; height: 0.3vmin; background: var(--gray); margin: 0.5vmin 0; }

        /* Renk Paleti */
        .color-grid { display: grid; grid-template-columns: 1fr; gap: 1.2vmin; width: 100%; justify-items: center; }
        .color-btn { width: 5.5vmin; height: 5.5vmin; border-radius: 1.5vmin; border: 0.4vmin solid var(--border-color); cursor: pointer; box-shadow: 0 0.4vmin 0 rgba(0,0,0,0.2); transition: transform 0.1s; }
        .color-btn.active { transform: scale(1.2) translateY(-0.3vmin); box-shadow: 0 0.8vmin 0 rgba(0,0,0,0.2); }

        /* Tuval Alanı */
        #canvas-wrapper {
            flex-grow: 1; position: relative; border: 0.8vmin solid var(--border-color);
            border-radius: 3vmin; background: white; box-shadow: 0 1.5vmin 3vmin rgba(0,0,0,0.1);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Touch-action: none ÇOK ÖNEMLİDİR - Telefondaki kaydırma hareketlerini tamamen bloke eder */
        #drawing-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }

        #coloring-template {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; z-index: 20; pointer-events: none;
        }

        .pop-anim { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="rotate-overlay">
    <div class="phone-icon">📱</div>
    <h2>Please Rotate!</h2>
    <h3 style="color:var(--dark); margin:0;">Turn your device sideways to paint.</h3>
</div>

<div id="app-layout">
    <header id="ui-header">
        <h1 class="logo">Nora <span>Paint</span> 🎨</h1>
        <div class="header-actions">
            <button class="btn-action btn-clear" id="btn-clear">🗑️ Clear</button>
            <button class="btn-action btn-save" id="btn-save">💾 Save Art</button>
        </div>
    </header>

    <main id="workspace">
        <aside class="side-panel">
            <span class="section-label">Size</span>
            <div class="size-row">
                <button class="size-btn size-sm" data-size="8"><div class="dot"></div></button>
                <button class="size-btn size-md active" data-size="20"><div class="dot"></div></button>
                <button class="size-btn size-lg" data-size="40"><div class="dot"></div></button>
            </div>

            <div class="divider"></div>

            <span class="section-label">Brushes</span>
            <button class="effect-btn active" data-effect="normal">🖌️ Pencil</button>
            <button class="effect-btn" data-effect="water">💧 Water</button>
            <button class="effect-btn" data-effect="acrylic">🎨 Acrylic</button>
            <button class="effect-btn" data-effect="spray">💨 Spray</button>
			<button class="effect-btn" data-effect="star">⭐ Star</button>
			<button class="effect-btn" data-effect="heart">❤️ Heart</button>
			<button class="effect-btn" data-effect="square">⬛ Square</button>
			<button class="effect-btn" data-effect="splash">🎈 Splash</button>

            <div class="divider"></div>

            <button class="effect-btn" id="btn-eraser" style="background:#FEE2E2; color:#991B1B; border-color:#FCA5A5;">🧹 Eraser</button>

            <div class="divider"></div>
            
            <span class="section-label">Pages</span>
            <div class="nav-arrows">
                <button class="nav-btn" id="btn-prev" title="Previous Page">◀</button>
                <button class="nav-btn" id="btn-next" title="Next Page">▶</button>
            </div>
        </aside>

        <section id="canvas-wrapper">
            <canvas id="drawing-canvas"></canvas>
            <img id="coloring-template" src="" alt="Template" style="display: none;">
        </section>

        <aside class="side-panel" style="width:12vmin;">
            <span class="section-label">Colors</span>
            <div class="color-grid" id="color-palette"></div>
        </aside>
    </main>
</div>

<script>
     const TEMPLATES = [
        "", // Blank Page
        "Assets/cat.png",
        "Assets/dog.png",
        "Assets/home.png",
        "Assets/winter.png",
        "Assets/turtle.png",
        "Assets/koala.png",
        "Assets/elephant.png",
        "Assets/jungle.png",
        "Assets/shark.png",
        "Assets/lion.png",
        "Assets/unicorn.png",
        "Assets/dragon.png",
        "Assets/dinosaur.png",
        "Assets/trucks.png",
        "Assets/car.png",
        "Assets/firetruck.png",
        "Assets/astronaut.png",
        "Assets/space.png"
    ];

    const COLORS = [
        '#000000', '#777777', '#9CA3AF', '#FFFFFF', '#efc794', 
        '#ffff00', '#ff8000', '#ff0000', '#1bc727', '#008000', 
        '#4DFEFF', '#00bfff', '#004aad', '#00003d', '#e99ac4', 
        '#FF1493', '#d155e0', '#8A2BE2', '#7F5C0E', '#4B251C'
    ];

    let currentColor = COLORS[0];
    let currentSize = 20;
    let currentEffect = 'normal'; 
    let isEraser = false;
    let currentTemplateIndex = 0;

    let isDrawing = false, lastX = 0, lastY = 0;

    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const wrapper = document.getElementById('canvas-wrapper');
    const templateImg = document.getElementById('coloring-template');
    
    const colorPalette = document.getElementById('color-palette');
    const sizeBtns = document.querySelectorAll('.size-btn');
    const effectBtns = document.querySelectorAll('.effect-btn:not(#btn-eraser)');
    const eraserBtn = document.getElementById('btn-eraser');
    const clearBtn = document.getElementById('btn-clear');
    const saveBtn = document.getElementById('btn-save');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Sayfa Yükleme
    function loadTemplate(index) {
        const src = TEMPLATES[index]; 
        
        if (src) {
            templateImg.src = src; 
            templateImg.style.display = 'block';
        } else {
            templateImg.style.display = 'none';
        }
        
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1.0;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
    }

    function initColors() {
        colorPalette.innerHTML = '';
        COLORS.forEach((color, index) => {
            const btn = document.createElement('button');
            btn.className = 'color-btn' + (index === 0 ? ' active' : '');
            btn.style.backgroundColor = color;
            btn.dataset.color = color;
            btn.addEventListener('click', () => {
                currentColor = color;
                isEraser = false;
                updateActiveTool(colorPalette.children, btn);
                eraserBtn.classList.remove('active');
                
                const activeEffectBtn = Array.from(effectBtns).find(b => b.dataset.effect === currentEffect);
                if(activeEffectBtn) updateActiveTool(effectBtns, activeEffectBtn);
            });
            colorPalette.appendChild(btn);
        });
    }

    function resizeCanvas() {
        const rect = wrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(canvas, 0, 0);

        canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
        canvas.style.width = `${rect.width}px`; canvas.style.height = `${rect.height}px`;

        ctx.scale(dpr, dpr);

        if(tempCanvas.width === 0) {
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, rect.width, rect.height);
        } else {
            ctx.drawImage(tempCanvas, 0, 0, rect.width, rect.height);
        }
    }

    // 1. KOORDİNAT OKUYUCU (Sadece Kesin Pointer Event Kullanılıyor)
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        return { 
            x: e.clientX - rect.left, 
            y: e.clientY - rect.top 
        };
    }

    /* --- ÇİZİM MOTORU --- */
    function startDrawing(e) {
        if (e.cancelable) e.preventDefault(); // Ekran kaymasını engeller
        isDrawing = true;
        
        // Hızlı çizimlerde fırçanın tuvalden çıkıp kopmamasını sağlar
        if(e.pointerId) canvas.setPointerCapture(e.pointerId);
        
        const pos = getPointerPos(e);
        lastX = pos.x; lastY = pos.y;
        renderBrushStroke(pos.x, pos.y, true);
    }

    function draw(e) {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault(); 
        
        const pos = getPointerPos(e);

        if (currentEffect === 'spray' && !isEraser) {
            renderSprayInterpolation(lastX, lastY, pos.x, pos.y);
        } else {
            renderBrushStroke(pos.x, pos.y, false);
        }

        lastX = pos.x; lastY = pos.y;
    }

    function stopDrawing(e) { 
        if (isDrawing && e.pointerId) canvas.releasePointerCapture(e.pointerId);
        isDrawing = false; 
    }
    
    function renderBrushStroke(x, y, isDot) {
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        if (isEraser) {
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = currentSize;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
        } 
        else if (currentEffect === 'normal') {
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
            ctx.strokeStyle = currentColor; ctx.lineWidth = currentSize;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
        } 
        else if (currentEffect === 'water') {
            ctx.globalAlpha = 0.22;
            ctx.shadowColor = currentColor; ctx.shadowBlur = currentSize * 0.5;
            ctx.strokeStyle = currentColor; ctx.lineWidth = currentSize;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
            ctx.shadowBlur = 0; 
        } 
        else if (currentEffect === 'acrylic') {
            ctx.globalAlpha = 0.96;
            ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 2;
            ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;
            ctx.strokeStyle = currentColor; ctx.lineWidth = currentSize;
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
            ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
        }
        else if (currentEffect === 'star') {
            drawStar(x, y, 5, currentSize, currentSize / 2, currentColor);
        }
        else if (currentEffect === 'heart') {
            drawHeart(x, y, currentSize, currentColor);
        }
        else if (currentEffect === 'square') {
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
            ctx.fillStyle = currentColor;
            ctx.fillRect(x - (currentSize/2), y - (currentSize/2), currentSize, currentSize);
        }
        else if (currentEffect === 'splash') {
            drawSplash(x, y, currentSize, currentColor);
        }

        if (isDot && currentEffect !== 'spray' && currentEffect !== 'star' && currentEffect !== 'heart' && currentEffect !== 'square' && currentEffect !== 'splash') {
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+0.1, y+0.1); ctx.stroke();
        }
    }

    function renderSprayInterpolation(x1, y1, x2, y2) {
        ctx.globalAlpha = 0.8; 
        ctx.shadowBlur = 0;
        ctx.fillStyle = currentColor;
        const dist = Math.hypot(x2 - x1, y2 - y1);
        const steps = Math.max(1, Math.floor(dist / 3)); 

        const dotsPerStep = Math.floor(currentSize * 0.8);
        const radius = currentSize / 2;

        ctx.beginPath();
        for (let s = 0; s <= steps; s++) {
            const currentX = x1 + (x2 - x1) * (s / steps);
            const currentY = y1 + (y2 - y1) * (s / steps);
            
            for (let i = 0; i < dotsPerStep; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * radius;
                ctx.rect(currentX + r * Math.cos(angle), currentY + r * Math.sin(angle), 1.5, 1.5);
            }
        }
        ctx.fill(); 
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
        ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
        ctx.fillStyle = color;
        let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
        ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y); rot += step;
            x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y); rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius); ctx.closePath(); ctx.fill();
    }

    function drawHeart(cx, cy, size, color) {
        ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(cx, cy + size * 0.4);
        ctx.bezierCurveTo(cx - size, cy - size * 0.6, cx - size * 1.5, cy + size * 0.5, cx, cy + size * 1.4);
        ctx.bezierCurveTo(cx + size * 1.5, cy + size * 0.5, cx + size, cy - size * 0.6, cx, cy + size * 0.4);
        ctx.closePath(); ctx.fill();
    }

    function drawSplash(cx, cy, radius, color) {
        ctx.globalAlpha = 1.0; 
        ctx.shadowBlur = 0;
        ctx.fillStyle = color;

        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.4, 0, Math.PI * 2);
        ctx.arc(cx + radius * 0.1, cy - radius * 0.1, radius * 0.35, 0, Math.PI * 2);
        ctx.fill();

        const spikes = 12; 
        
        for (let i = 0; i < spikes; i++) {
            let angle = (i * Math.PI * 2) / spikes + (Math.random() * 0.4 - 0.2);
            let length = radius * (0.6 + Math.random() * 0.9); 
            
            let targetX = cx + Math.cos(angle) * length;
            let targetY = cy + Math.sin(angle) * length;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = radius * (0.08 + Math.random() * 0.12); 
            ctx.lineCap = 'round';
            ctx.moveTo(cx, cy);
            ctx.lineTo(targetX, targetY);
            ctx.stroke();

            if (Math.random() > 0.3) {
                ctx.beginPath();
                let dotRadius = radius * (0.05 + Math.random() * 0.1);
                ctx.arc(targetX, targetY, dotRadius, 0, Math.PI * 2);
                
                let extraX = targetX + Math.cos(angle) * (radius * 0.2);
                let extraY = targetY + Math.sin(angle) * (radius * 0.2);
                ctx.arc(extraX, extraY, dotRadius * 0.6, 0, Math.PI * 2);
                
                ctx.fill();
            }
        }
    }

    
    canvas.addEventListener('pointerdown', startDrawing); 
    canvas.addEventListener('pointermove', draw, { passive: false });
    canvas.addEventListener('pointerup', stopDrawing); 
    canvas.addEventListener('pointercancel', stopDrawing);

    sizeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            currentSize = parseInt(btn.dataset.size); updateActiveTool(sizeBtns, btn);
        });
    });

    effectBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            currentEffect = btn.dataset.effect; isEraser = false;
            updateActiveTool(effectBtns, btn); eraserBtn.classList.remove('active');
        });
    });

    eraserBtn.addEventListener('click', () => {
        isEraser = true; eraserBtn.classList.add('active');
        effectBtns.forEach(b => b.classList.remove('active'));
    });

    clearBtn.addEventListener('click', () => {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1.0; 
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
        
        clearBtn.classList.add('pop-anim'); 
        setTimeout(() => clearBtn.classList.remove('pop-anim'), 300);
    });

    saveBtn.addEventListener('click', () => {
    // 1. EKRANIN O ANKİ GERÇEK PİKSEL BOYUTUNU AL (Fullscreen modunda kaymayı bitirir)
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = canvas.width; // Tuvalin o anki fiziksel genişliği
    exportCanvas.height = canvas.height; // Tuvalin o anki fiziksel yüksekliği
    const eCtx = exportCanvas.getContext('2d');
    
    // 2. Arka planı beyaz yap
    eCtx.fillStyle = '#FFFFFF';
    eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
    
    // 3. Boyamaları çiz
    eCtx.drawImage(canvas, 0, 0);

    // 4. Şablonu da tuvalin gerçek boyutuna göre ortala
    if (templateImg.style.display === 'block' && templateImg.src) {
        try {
            const iw = templateImg.naturalWidth;
            const ih = templateImg.naturalHeight;
            const cw = exportCanvas.width;
            const ch = exportCanvas.height;
            
            // Oranı koruyarak sığdır
            const scale = Math.min(cw / iw, ch / ih);
            const dw = iw * scale;
            const dh = ih * scale;
            const dx = (cw - dw) / 2;
            const dy = (ch - dh) / 2;

            eCtx.drawImage(templateImg, dx, dy, dw, dh);
        } catch(e) {
            console.warn("Template image could not be merged.", e);
        }
    }

    // İndirme işlemini tetikle
    const dataUrl = exportCanvas.toDataURL('image/png');
    const link = document.createElement('a'); 
    link.download = 'Nora_Paint_Art.png';
    link.href = dataUrl; 
    document.body.appendChild(link); 
    link.click();
    document.body.removeChild(link);
});

    btnPrev.addEventListener('click', () => {
        currentTemplateIndex--;
        if (currentTemplateIndex < 0) currentTemplateIndex = TEMPLATES.length - 1;
        loadTemplate(currentTemplateIndex);
        btnPrev.classList.add('pop-anim');
        setTimeout(() => btnPrev.classList.remove('pop-anim'), 300);
    });

    btnNext.addEventListener('click', () => {
        currentTemplateIndex++;
        if (currentTemplateIndex >= TEMPLATES.length) currentTemplateIndex = 0;
        loadTemplate(currentTemplateIndex);
        btnNext.classList.add('pop-anim');
        setTimeout(() => btnNext.classList.remove('pop-anim'), 300);
    });

    window.addEventListener('resize', resizeCanvas);
    function updateActiveTool(list, activeBtn) { Array.from(list).forEach(btn => btn.classList.remove('active')); activeBtn.classList.add('active'); }
    initColors(); setTimeout(resizeCanvas, 100); 
</script>
