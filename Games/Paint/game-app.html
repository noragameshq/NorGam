<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nora Paint & Color</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-color: #2D3748;
            --bg-color: #F8FAFC;
            --panel-bg: #FFFFFF;
            --pink: #F472B6;
            --green: #34D399;
            --blue: #5CE1E6;
            --yellow: #FFDE59;
            --purple: #C084FC;
            --red: #F87171;
            --dark: #334155;
            --gray: #E2E8F0;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            font-family: 'Fredoka One', cursive;
            display: flex; flex-direction: column; align-items: center;
            height: 100dvh; overflow: hidden; touch-action: none;
            user-select: none; -webkit-user-select: none;
        }

        /* --- ZORUNLU YATAY MOD --- */
        #rotate-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 10000;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .phone-icon { font-size: 6vmin; margin-bottom: 2vmin; animation: rotatePhone 2s ease-in-out infinite; }
        @keyframes rotatePhone { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
        #rotate-overlay h2 { color: var(--pink); font-size: 4vmin; margin: 0 0 1vmin 0; text-shadow: 0.3vmin 0.3vmin 0 var(--border-color); }
        
        @media screen and (orientation: portrait) {
            #rotate-overlay { display: flex; }
            #app-layout { display: none !important; }
        }

        #app-layout { display: flex; flex-direction: column; width: 100%; height: 100%; box-sizing: border-box; }

        /* --- HEADER --- */
        #ui-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5vmin 3vmin; box-sizing: border-box; z-index: 50; }
        .logo { font-size: 3.2vmin; color: var(--purple); text-shadow: 0.3vmin 0.3vmin 0 var(--border-color); margin: 0; }
        .logo span { color: var(--yellow); }
        
        .header-actions { display: flex; gap: 2vmin; }
        .btn-action {
            font-family: 'Fredoka One', cursive; font-size: 1.8vmin; padding: 1.2vmin 3vmin;
            background: white; color: var(--border-color); border: 0.4vmin solid var(--border-color);
            border-radius: 3vmin; cursor: pointer; box-shadow: 0 0.5vmin 0 var(--border-color);
            display: flex; align-items: center; gap: 1vmin; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-action:active { transform: translateY(0.5vmin); box-shadow: 0 0 0 var(--border-color); }
        .btn-clear { background-color: var(--red); color: white; }
        .btn-save { background-color: var(--green); color: white; }

        /* --- WORKSPACE --- */
        #workspace { display: flex; flex-direction: row; flex-grow: 1; gap: 2.5vmin; padding: 0 3vmin 3vmin 3vmin; box-sizing: border-box; overflow: hidden; }

        /* Sol Kokpit */
       /* Sağdaki ve Soldaki Kokpitler */
        .side-panel {
            width: 17vmin; 
            background: var(--panel-bg); 
            border: 0.6vmin solid var(--border-color);
            border-radius: 3vmin; 
            box-shadow: 0 1vmin 2vmin rgba(0,0,0,0.05);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 1.5vmin 1vmin; 
            gap: 1.2vmin;
            box-sizing: border-box;
            
            /* EKLENEN KOD: İçerik çoksa aşağı kaydırmayı açar, yatay kaydırmayı gizler */
            overflow-y: auto; 
            overflow-x: hidden;
        }
        
        .section-label { font-size: 1.5vmin; color: #64748B; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        /* Boyut Seçici */
        .size-row { display: flex; gap: 1vmin; width: 100%; justify-content: center; }
        .size-btn {
            width: 4.5vmin; height: 4.5vmin; border-radius: 50%; border: 0.3vmin solid var(--gray);
            background: white; cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: all 0.2s; padding: 0;
        }
        .size-btn.active { border-color: var(--border-color); transform: scale(1.15); box-shadow: 0 0.4vmin 0 var(--border-color); }
        .size-btn .dot { background: var(--dark); border-radius: 50%; }
        .size-sm .dot { width: 1.2vmin; height: 1.2vmin; }
        .size-md .dot { width: 2.2vmin; height: 2.2vmin; }
        .size-lg .dot { width: 3.2vmin; height: 3.2vmin; }

        /* Fırça Efekt Butonları */
        .effect-btn {
            width: 92%; padding: 1.5vmin; border-radius: 1.5vmin; border: 0.3vmin solid var(--gray);
            background: white; font-family: 'Fredoka One', cursive; font-size: 1.8vmin; color: var(--dark);
            display: flex; align-items: center; gap: 1vmin; cursor: pointer; transition: all 0.2s;
            box-sizing: border-box; text-align: left;
        }
        .effect-btn.active {
            border-color: var(--border-color); background: var(--yellow);
            color: var(--border-color); transform: scale(1.05); box-shadow: 0 0.5vmin 0 var(--border-color);
        }

        /* Navigasyon Okları */
        .nav-arrows {
            display: flex; gap: 1vmin; width: 92%; justify-content: space-between;
        }
        .nav-btn {
            flex: 1; padding: 1.5vmin 0; border-radius: 1.5vmin; border: 0.3vmin solid var(--gray);
            background: var(--bg-color); color: var(--dark); font-size: 2.5vmin; cursor: pointer;
            transition: all 0.2s; box-sizing: border-box; display: flex; justify-content: center; align-items: center;
        }
        .nav-btn:active { transform: scale(0.95); background: var(--gray); border-color: var(--border-color); }

        .divider { width: 80%; height: 0.3vmin; background: var(--gray); margin: 0.5vmin 0; }

        /* Renk Paleti */
        .color-grid { display: grid; grid-template-columns: 1fr; gap: 1.2vmin; width: 100%; justify-items: center; }
        .color-btn { width: 5.5vmin; height: 5.5vmin; border-radius: 1.5vmin; border: 0.4vmin solid var(--border-color); cursor: pointer; box-shadow: 0 0.4vmin 0 rgba(0,0,0,0.2); transition: transform 0.1s; }
        .color-btn.active { transform: scale(1.2) translateY(-0.3vmin); box-shadow: 0 0.8vmin 0 rgba(0,0,0,0.2); }

        /* Tuval Alanı */
        #canvas-wrapper {
            flex-grow: 1; position: relative; border: 0.8vmin solid var(--border-color);
            border-radius: 3vmin; background: white; box-shadow: 0 1.5vmin 3vmin rgba(0,0,0,0.1);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* Touch-action: none ÇOK ÖNEMLİDİR - Telefondaki kaydırma hareketlerini tamamen bloke eder */
        #drawing-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; touch-action: none; }

        #coloring-template {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; z-index: 20; pointer-events: none;
        }

        .pop-anim { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="rotate-overlay">
    <div class="phone-icon">📱</div>
    <h2>Please Rotate!</h2>
    <h3 style="color:var(--dark); margin:0;">Turn your device sideways to paint.</h3>
</div>

<div id="app-layout">
    <header id="ui-header">
        <h1 class="logo">Nora <span>Paint</span> 🎨</h1>
        <div class="header-actions">
            <button class="btn-action btn-clear" id="btn-clear">🗑️ Clear</button>
            <button class="btn-action btn-save" id="btn-save">💾 Save Art</button>
        </div>
    </header>

    <main id="workspace">
        <aside class="side-panel">
            <span class="section-label">Size</span>
            <div class="size-row">
                <button class="size-btn size-sm" data-size="8"><div class="dot"></div></button>
                <button class="size-btn size-md active" data-size="20"><div class="dot"></div></button>
                <button class="size-btn size-lg" data-size="40"><div class="dot"></div></button>
            </div>

            <div class="divider"></div>

            <span class="section-label">Brushes</span>
            <button class="effect-btn active" data-effect="normal">🖌️ Pencil</button>
            <button class="effect-btn" data-effect="water">💧 Water</button>
            <button class="effect-btn" data-effect="acrylic">🎨 Acrylic</button>
            <button class="effect-btn" data-effect="spray">💨 Spray</button>
			<button class="effect-btn" data-effect="star">⭐ Star</button>
			<button class="effect-btn" data-effect="heart">❤️ Heart</button>
			<button class="effect-btn" data-effect="square">⬛ Square</button>
			<button class="effect-btn" data-effect="splash">🎈 Splash</button>

            <div class="divider"></div>

            <button class="effect-btn" id="btn-eraser" style="background:#FEE2E2; color:#991B1B; border-color:#FCA5A5;">🧹 Eraser</button>

            <div class="divider"></div>
            
            <span class="section-label">Pages</span>
            <div class="nav-arrows">
                <button class="nav-btn" id="btn-prev" title="Previous Page">◀</button>
                <button class="nav-btn" id="btn-next" title="Next Page">▶</button>
            </div>
        </aside>

        <section id="canvas-wrapper">
            <canvas id="drawing-canvas"></canvas>
            <img id="coloring-template" src="" alt="Template" style="display: none;">
        </section>

        <aside class="side-panel" style="width:12vmin;">
            <span class="section-label">Colors</span>
            <div class="color-grid" id="color-palette"></div>
        </aside>
    </main>
</div>
