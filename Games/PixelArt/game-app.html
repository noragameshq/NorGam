<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
       :root{--bg-main:#475569;--border-color:#1e293b;--text-color:#334155;--c-green:#22C55E;--c-blue:#3B82F6;--c-orange:#F97316;--c-yellow:#EAB308;--c-pink:#EC4899;--c-red:#EF4444;--c-cyan:#06b6d4;--c-purple:#8b5cf6;--c-brown:#8b4513;--c-black:#1e293b;--c-white:#ffffff;--c-lime:#84cc16}body{margin:0;padding:0;background-color:var(--bg-main);background-image:radial-gradient(rgb(255 255 255 / .1) 2px,transparent 2px);background-size:30px 30px;font-family:'Fredoka One',cursive;display:flex;flex-direction:column;align-items:center;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}#app-layout{display:flex;flex-direction:column;width:100%;height:100%;box-sizing:border-box}#ui-header{display:flex;justify-content:space-between;align-items:center;padding:1.5vmin 3vmin;z-index:50;background:rgb(255 255 255 / .95);box-shadow:0 .5vmin 1vmin rgb(0 0 0 / .1)}.logo{font-size:3.5vmin;color:var(--c-blue);text-shadow:.3vmin .3vmin 0 var(--border-color);margin:0;cursor:pointer}.logo span{color:var(--c-pink)}.header-actions{display:flex;gap:2vmin;align-items:center}.btn-round{width:6.5vmin;height:6.5vmin;border-radius:50%;border:.4vmin solid var(--border-color);background:#fff;font-size:3vmin;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:0 .5vmin 0 var(--border-color);transition:transform 0.1s,box-shadow 0.1s}.btn-round:active{transform:translateY(.5vmin);box-shadow:0 0 0 var(--border-color)}#home-view,#game-view{flex-grow:1;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:3vmin;box-sizing:border-box}.hidden{display:none!important}.gallery-title{font-size:5vmin;color:#fff;text-shadow:.4vmin .4vmin 0 var(--border-color);margin:0 0 3vmin 0;-webkit-text-stroke:.2vmin var(--border-color)}#gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:3vmin;width:100%;max-width:1200px;padding-bottom:5vmin}.gallery-card{background:#fff;border-radius:2vmin;border:.6vmin solid var(--border-color);box-shadow:0 1.5vmin 0 rgb(0 0 0 / .2);padding:2vmin;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform 0.1s}.gallery-card:active{transform:translateY(1vmin);box-shadow:0 .5vmin 0 rgb(0 0 0 / .2)}.card-preview{width:100%;aspect-ratio:1;background:#e2e8f0;border-radius:1vmin;margin-bottom:1.5vmin;display:flex;justify-content:center;align-items:center}.card-title{font-size:2.5vmin;color:var(--text-color);margin:0;text-align:center}.difficulty-badge{font-family:'Quicksand';font-size:1.8vmin;font-weight:700;padding:.5vmin 1.5vmin;border-radius:2vmin;margin-top:1vmin;color:#fff}.diff-easy{background:var(--c-green)}.diff-med{background:var(--c-orange)}.diff-hard{background:var(--c-red)}.game-title-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:900px;margin-bottom:2vmin}.game-title{font-size:4vmin;color:#fff;margin:0;text-shadow:.3vmin .3vmin 0 var(--border-color);-webkit-text-stroke:.15vmin var(--border-color)}.workspace-container{display:flex;flex-direction:row;gap:4vmin;width:100%;max-width:1000px;justify-content:center;align-items:flex-start}.mirror-container{display:flex;background:#fff;border:1vmin solid var(--border-color);border-radius:2vmin;box-shadow:0 2vmin 3vmin rgb(0 0 0 / .3);overflow:hidden;position:relative}.mirror-line{width:1vmin;background:var(--border-color);z-index:5}.pixel-grid{display:grid;background:#f8fafc}.pixel-cell{background-color:#fff0;border:1px solid rgb(0 0 0 / .05);box-sizing:border-box;cursor:crosshair;touch-action:none}#left-grid .pixel-cell{cursor:default}.tools-panel{background:rgb(255 255 255 / .95);border:.6vmin solid var(--border-color);border-radius:3vmin;padding:3vmin;display:flex;flex-direction:column;gap:2.5vmin;box-shadow:0 1vmin 0 var(--border-color);align-items:center}.palette-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5vmin}.color-btn{width:7vmin;height:7vmin;border-radius:1.5vmin;border:.4vmin solid var(--border-color);cursor:pointer;box-shadow:inset -.5vmin -.5vmin 0 rgb(0 0 0 / .2),inset .5vmin .5vmin 0 rgb(255 255 255 / .4);transition:transform 0.1s}.color-btn.active{transform:scale(1.15);border:.6vmin solid #fff;outline:.4vmin solid var(--border-color)}.eraser-btn{width:100%;height:6vmin;border-radius:1.5vmin;border:.4vmin solid var(--border-color);background:#e2e8f0;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:3vmin}.eraser-btn.active{background:#cbd5e1;border:.6vmin solid #fff;outline:.4vmin solid var(--border-color)}.action-group{display:flex;flex-direction:column;gap:1.5vmin;width:100%;margin-top:1vmin}.tool-btn{font-family:'Fredoka One';font-size:3vmin;padding:1.5vmin;border-radius:2vmin;border:.4vmin solid var(--border-color);cursor:pointer;color:#fff;text-shadow:0 .2vmin 0 rgb(0 0 0 / .3);box-shadow:0 .6vmin 0 var(--border-color);transition:transform 0.1s}.tool-btn:active{transform:translateY(.6vmin);box-shadow:0 0 0 var(--border-color)}.btn-check{background:var(--c-green);box-shadow:0 .6vmin 0 #15803d;border-color:#14532d}.btn-check:active{box-shadow:0 0 0 #15803d}.btn-save{background:var(--c-blue);box-shadow:0 .6vmin 0 #1d4ed8;border-color:#1e3a8a}.btn-save:active{box-shadow:0 0 0 #1d4ed8}#btn-reset{width:100%;background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);box-shadow:inset 0 .5vmin 1vmin rgb(255 255 255 / .4),0 .6vmin 0 #7f1d1d;position:relative;overflow:hidden}#btn-reset::before{content:'';position:absolute;top:.2vmin;left:10%;width:80%;height:35%;border-radius:2vmin 2vmin 1vmin 1vmin;background:linear-gradient(to bottom,rgb(255 255 255 / .5) 0%,#fff0 100%)}#btn-reset:active{transform:translateY(.6vmin);box-shadow:inset 0 .5vmin 1vmin rgb(255 255 255 / .2),0 0 0 #7f1d1d}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgb(30 41 59 / .95);display:flex;justify-content:center;align-items:center;z-index:200;opacity:1;transition:opacity 0.3s}.modal-box{background:#fff;padding:5vmin;border-radius:4vmin;border:.8vmin solid var(--border-color);box-shadow:0 2vmin 0 rgb(0 0 0 / .3);text-align:center;max-width:500px;width:85%}.magic-star{position:absolute;pointer-events:none;z-index:350;opacity:0}@media (max-aspect-ratio:1/1){.workspace-container{flex-direction:column;align-items:center}.tools-panel{flex-direction:row;flex-wrap:wrap;width:100%;justify-content:center}.action-group{flex-direction:row;width:auto}.palette-grid{display:flex;flex-wrap:wrap;justify-content:center}}
    </style>
</head>
<body>
<div id="app-layout">
    <header id="ui-header">
        <h1 class="logo" onclick="goHome()">Pixel <span>Art</span></h1>
        <div class="header-actions">
            <button class="btn-round" id="btn-sound">🔊</button>
        </div>
    </header>
    <div id="home-view">
        <h2 class="gallery-title">Choose a Picture!</h2>
        <div id="gallery-grid"></div>
    </div>
    <div id="game-view" class="hidden">
        <div class="game-title-bar">
            <button class="tool-btn" onclick="goHome()" style="background:var(--c-orange); width: auto;">◀ Back</button>
            <h2 class="game-title" id="current-lvl-title">Level Name</h2>
            <div style="width: 8vmin;"></div> </div>
        <div class="workspace-container">
            <div class="mirror-container">
                <div id="left-grid" class="pixel-grid"></div>
                <div class="mirror-line"></div>
                <div id="right-grid" class="pixel-grid"></div>
            </div>
            <div class="tools-panel">
                <div class="palette-grid" id="palette-grid">
                    </div>
                <div class="eraser-btn" id="btn-eraser">Eraser 🧽</div>      
                <div class="action-group">
                    <button class="tool-btn btn-check" id="btn-check">☑️ Check</button>
                    <button class="tool-btn btn-save" id="btn-save">💾 Save Image</button>
                    <button class="tool-btn" id="btn-reset">🔄 Reset</button>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="success-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h1 style="font-size: 7vmin; color: var(--c-green); margin: 0 0 2vmin 0;">Perfect Match! 🌟</h1>
        <p style="font-family:'Quicksand'; font-size:3vmin; color:var(--text-color); font-weight:700;">You completed!</p>
        <button class="tool-btn btn-save" onclick="downloadCanvas()" style="font-size: 4vmin; padding: 2vmin 4vmin; margin-bottom: 2vmin;">💾 Save to Device</button>
        <br>
        <button class="tool-btn" onclick="goHome()" style="background:var(--c-orange); font-size: 3.5vmin;">Gallery</button>
    </div>
</div>
