<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Popsicle Match Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-color: #2D3748;
            --stick-color: #E2E8F0;
            --stick-shadow: #CBD5E1;
            --bg-color: #F8FAFC;
            --pink: #F472B6;
            --green: #34D399;
            --blue: #5CE1E6;
            --yellow: #FFDE59;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            font-family: 'Fredoka One', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- ZORUNLU YATAY MOD (PORTRAIT UYARISI) --- */
        #rotate-overlay {
            display: none; /* Varsayılan olarak gizli */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            background-image: radial-gradient(#CBD5E1 2px, transparent 2px);
            background-size: 30px 30px;
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .phone-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        #rotate-overlay h2 { color: var(--pink); font-size: 2.5rem; margin: 0 0 10px 0; text-shadow: 2px 2px 0 var(--border-color); }
        #rotate-overlay p { color: var(--border-color); font-size: 1.5rem; margin: 0; }

        /* Ekran Dikey İse Oyunu Gizle, Uyarıyı Göster */
        @media screen and (orientation: portrait) {
            #ui-header, #game-wrapper, .modal-overlay { display: none !important; }
            #rotate-overlay { display: flex; }
        }

        /* --- HEADER LAYOUT --- */
        #ui-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2vmin 4vmin;
            box-sizing: border-box;
            z-index: 50;
        }

        .header-left { flex: 1; display: flex; justify-content: flex-start; }
        .header-center { flex: 1; display: flex; justify-content: center; }
        .header-right { flex: 1; display: flex; justify-content: flex-end; gap: 2vmin; }

        .logo {
            font-size: 4vmin;
            color: var(--pink);
            text-shadow: 0.3vmin 0.3vmin 0 var(--border-color);
            margin: 0;
            line-height: 1;
            transform: rotate(-3deg);
            white-space: nowrap;
        }
        .logo span { color: var(--blue); }

        .stats-pill {
            background: white;
            padding: 1vmin 3vmin;
            border-radius: 30px;
            border: 0.4vmin solid var(--border-color);
            box-shadow: 0 0.6vmin 0 var(--border-color);
            font-size: 2.5vmin;
            color: var(--border-color);
            display: flex;
            gap: 3vmin;
            white-space: nowrap;
        }

        .stats-pill span.score-text { color: var(--pink); font-size: 3vmin; }
        .stats-pill span.level-text { color: var(--green); font-size: 3vmin; }

        .btn-round {
            background: white;
            border: 0.4vmin solid var(--border-color);
            border-radius: 50%;
            width: 7vmin; height: 7vmin;
            font-size: 3vmin;
            cursor: pointer;
            box-shadow: 0 0.5vmin 0 var(--border-color);
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--border-color);
        }
        .btn-round:active { transform: translateY(0.5vmin); box-shadow: 0 0 0 var(--border-color); }
        .btn-shop { background-color: var(--yellow); }
        .btn-info { background-color: var(--blue); }

        /* --- MAIN CONTENT (SIDE BY SIDE) --- */
        #game-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-grow: 1;
            gap: 8vmin;
            padding: 2vmin;
            box-sizing: border-box;
        }

        /* --- TARGET CARD (RESPONSIVE VMIN İLE ÖLÇEKLENDİRİLDİ) --- */
        #target-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vmin;
        }

        .target-title {
            font-size: 4vmin;
            color: var(--border-color);
            text-shadow: 0.2vmin 0.2vmin 0px #FFF;
            animation: pulseText 1.5s infinite alternate;
        }

        #target-container {
            background: white;
            padding: 3vmin;
            border-radius: 3vmin;
            box-shadow: 0 1vmin 2vmin rgba(0,0,0,0.1);
            border: 0.8vmin solid var(--border-color);
            position: relative;
            z-index: 20;
        }

        @keyframes popWobble {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.08) rotate(-4deg); }
            50% { transform: scale(1.08) rotate(4deg); }
            75% { transform: scale(1.04) rotate(-2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .wobble-anim { animation: popWobble 0.6s cubic-bezier(0.25, 0.8, 0.25, 1); }

        .target-body {
            width: 18vmin;
            height: 25vmin;
            border: 0.8vmin solid var(--border-color);
            border-radius: 9vmin 9vmin 2vmin 2vmin;
            position: relative;
            overflow: hidden;
            background: var(--bg-color); 
        }

        .target-stick {
            width: 5vmin;
            height: 7vmin;
            background: var(--stick-color);
            border: 0.8vmin solid var(--border-color);
            border-top: none;
            border-radius: 0 0 2vmin 2vmin;
            margin: -0.8vmin auto 0 auto;
            z-index: 1;
            box-shadow: inset -0.5vmin 0 0 var(--stick-shadow);
        }

        /* --- PLAY AREA --- */
        #play-area {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            border: 1.2vmin solid var(--border-color);
            border-radius: 2vmin;
            box-shadow: 0 2vmin 4vmin rgba(0,0,0,0.15);
            background: white;
            overflow: hidden;
        }

        .grid-board {
            display: grid;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease;
        }

        .cell {
            width: 100%; height: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.03);
        }

        /* --- DRAGGABLE FRAME --- */
        #frame-container {
            position: absolute;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            filter: drop-shadow(0 1.5vmin 1.5vmin rgba(0,0,0,0.3));
        }

        #frame-container:active { cursor: grabbing; filter: drop-shadow(0 0.8vmin 0.8vmin rgba(0,0,0,0.4)); }

        .frame-body {
            width: 100%;
            height: 100%;
            border: 1.2vmin solid var(--border-color);
            border-radius: 50% 50% 10% 10% / 30% 30% 10% 10%;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.01);
            box-shadow: inset 0 0 2.5vmin rgba(0,0,0,0.3);
        }

        .frame-stick {
            width: 25%;
            height: 30%;
            background: var(--stick-color);
            border: 1vmin solid var(--border-color);
            border-top: none;
            border-radius: 0 0 2vmin 2vmin;
            margin-top: -1vmin;
            box-sizing: border-box;
            box-shadow: inset -0.6vmin 0 0 var(--stick-shadow);
        }

        /* --- MODALS & OVERLAYS --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45, 55, 72, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.hidden { opacity: 0; pointer-events: none; }

        .modal-box {
            background: white; padding: 4vmin; border-radius: 3vmin;
            border: 0.8vmin solid var(--border-color); box-shadow: 0 2vmin 0 rgba(0,0,0,0.2);
            text-align: center; max-width: 500px; width: 80%; position: relative;
        }

        .modal-box h2 { margin-top: 0; color: var(--pink); font-size: 4vmin; }

        /* Video CSS Güncellemesi */
        .tutorial-video {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            box-sizing: border-box;
            border: 0.5vmin solid var(--border-color);
            border-radius: 2vmin;
            margin-bottom: 2.5vmin;
            background: #E2E8F0;
            outline: none;
            box-shadow: 0 0.5vmin 0 rgba(0,0,0,0.1);
        }

        .close-btn {
            font-family: 'Fredoka One', cursive; font-size: 2.5vmin; padding: 1.5vmin 4vmin;
            background-color: var(--green); color: white; border: 0.5vmin solid var(--border-color);
            border-radius: 3vmin; cursor: pointer; box-shadow: 0 0.8vmin 0 #059669;
        }
        .close-btn:active { transform: translateY(0.8vmin); box-shadow: 0 0 0 #059669; }

        .fullscreen-overlay { background: rgba(248, 250, 252, 0.98); z-index: 300; }
        
        .title-text-1 { font-size: 10vmin; color: #F472B6; margin: 0; text-shadow: 0.6vmin 0.6vmin 0 var(--border-color); line-height: 1; }
        .title-text-2 { font-size: 8vmin; color: #5CE1E6; margin: -1vmin 0 4vmin 0; text-shadow: 0.6vmin 0.6vmin 0 var(--border-color); line-height: 1; }
        .action-btn { font-family: 'Fredoka One', cursive; font-size: 5vmin; padding: 3vmin 10vmin; background-color: var(--green); color: white; border: 0.6vmin solid var(--border-color); border-radius: 6vmin; cursor: pointer; box-shadow: 0 1.2vmin 0 #059669; transition: all 0.1s; animation: pulseText 1.5s infinite alternate; }
        .action-btn:active { transform: translateY(1.2vmin); box-shadow: 0 0 0 #059669; }

        .confetti { position: absolute; width: 2vmin; height: 2vmin; border-radius: 50%; animation: fall 1.5s linear forwards; z-index: 350; pointer-events: none; }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(800px) rotate(720deg); opacity: 0; }
        }
        @keyframes pulseText {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

<div id="rotate-overlay">
    <div class="phone-icon">📱</div>
    <h2>Please Rotate!</h2>
    <p>Turn your device sideways to play.</p>
</div>

<div id="ui-header">
    <div class="header-left">
        <h1 class="logo">Popsicle <span>Match!</span></h1>
    </div>
    
    <div class="header-center">
        <div class="stats-pill">
            <div>Score: <span id="score-val" class="score-text">0</span></div>
            <div>Level: <span id="level-val" class="level-text">1</span> <span style="font-size:1.8vmin; color:#94A3B8;">/ 30</span></div>
        </div>
    </div>
    
    <div class="header-right">
        <a href="#" target="_blank" class="btn-round btn-shop" title="Get Physical Toy!">🛍️</a>
        <button class="btn-round btn-info" id="info-btn" title="How to Play">❓</button>
        <button class="btn-round" id="sound-btn" title="Toggle Sound">🔊</button>
    </div>
</div>

<div id="game-wrapper">
    
    <div id="target-wrapper">
        <div class="target-title">Target:</div>
        <div id="target-container">
            <div class="target-body" id="target-body"></div>
            <div class="target-stick"></div>
        </div>
    </div>

    <div id="play-area">
        <div id="main-board" class="grid-board"></div>
        
        <div id="frame-container">
            <div class="frame-body"></div>
            <div class="frame-stick"></div>
        </div>
    </div>

</div>

<div id="how-to-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>How to Play!</h2>
        
        <video class="tutorial-video" autoplay loop muted playsinline>
            <source src="Assets/PopsicleMatch.mp4" type="video/mp4">
        </video>

        <p style="font-size: 2.2vmin; color: #475569; margin-bottom: 3vmin;">
            Drag the digital popsicle or use your physical toy to match the exact colors shown on the target card!
        </p>
        <button class="close-btn" id="close-info-btn">Got it! 👍</button>
    </div>
</div>

<div id="start-overlay" class="modal-overlay fullscreen-overlay">
    <div style="text-align: center;">
        <svg viewBox="0 0 120 160" width="20vmin" height="26vmin" style="filter: drop-shadow(0 2vmin 1.5vmin rgba(0,0,0,0.2)); margin-bottom: 3vmin;">
            <rect x="50" y="110" width="20" height="40" rx="8" fill="#E2E8F0" stroke="#2D3748" stroke-width="6" />
            <path d="M20,110 V50 A40,40 0 0,1 100,50 V110 Z" fill="#7ED957" stroke="#2D3748" stroke-width="6" />
            <path d="M60,10 A40,40 0 0,1 100,50 V110 H60 Z" fill="#FF91A4" />
            <path d="M20,60 H100 V110 H20 Z" fill="#FFDE59" />
            <path d="M60,60 H100 V110 H60 Z" fill="#5CE1E6" />
            <path d="M20,110 V50 A40,40 0 0,1 100,50 V110 Z" fill="none" stroke="#2D3748" stroke-width="8" />
            <line x1="60" y1="10" x2="60" y2="110" stroke="#2D3748" stroke-width="6" />
            <line x1="20" y1="60" x2="100" y2="60" stroke="#2D3748" stroke-width="6" />
        </svg>
        <h1 class="title-text-1">Popsicle</h1>
        <h1 class="title-text-2">Match!</h1>
        <button class="action-btn" id="start-btn">PLAY!</button>
    </div>
</div>

<div id="finale-overlay" class="modal-overlay fullscreen-overlay hidden">
    <div style="text-align: center;">
        <h1 style="font-size: 8vmin; color: #FFDE59; text-shadow: 0.6vmin 0.6vmin 0 var(--border-color); margin-bottom: 2vmin;">YOU DID IT!</h1>
        <h2 style="font-size: 5vmin; color: #34D399; margin-top: 0; margin-bottom: 6vmin;">All 30 Levels Completed! 🌟</h2>
        <button class="action-btn" id="restart-btn" style="background-color: var(--pink); box-shadow: 0 1.2vmin 0 #D53F8C;">Play Again!</button>
    </div>
</div>
