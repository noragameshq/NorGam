<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
       :root{--bg-main:#475569;--border-color:#1e293b;--text-color:#334155;--c-green:#22C55E;--c-blue:#3B82F6;--c-orange:#F97316;--c-yellow:#EAB308;--c-pink:#EC4899;--c-red:#EF4444}body{margin:0;padding:0;background-color:var(--bg-main);font-family:'Fredoka One',cursive;display:flex;flex-direction:column;align-items:center;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}#app-layout{display:flex;flex-direction:column;width:100%;height:100%;box-sizing:border-box}#ui-header{display:flex;justify-content:space-between;align-items:center;padding:1.5vmin 3vmin;z-index:50;background:rgb(255 255 255 / .95);box-shadow:0 .5vmin 1vmin rgb(0 0 0 / .1)}.logo{font-size:3.5vmin;color:var(--c-blue);text-shadow:.3vmin .3vmin 0 var(--border-color);margin:0}.logo span{color:var(--c-pink)}.header-actions{display:flex;gap:2vmin;align-items:center}.level-badge{background:#fff;padding:1vmin 3vmin;border-radius:3vmin;border:.4vmin solid var(--border-color);box-shadow:0 .5vmin 0 var(--border-color);font-size:2.2vmin;color:var(--text-color)}.level-badge span{color:var(--c-green)}.btn-round{width:6.5vmin;height:6.5vmin;border-radius:50%;border:.4vmin solid var(--border-color);background:#fff;font-size:3vmin;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:0 .5vmin 0 var(--border-color);transition:transform 0.1s,box-shadow 0.1s}.btn-round:active{transform:translateY(.5vmin);box-shadow:0 0 0 var(--border-color)}#workspace{display:flex;flex-direction:column;flex-grow:1;position:relative;background-size:cover;background-position:center;transition:background 0.5s ease}#theme-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgb(255 255 255 / .2);z-index:1;pointer-events:none}#theme-title{position:absolute;top:3vmin;left:50%;transform:translateX(-50%);font-size:4.5vmin;color:#fff;-webkit-text-stroke:.2vmin var(--border-color);text-shadow:.4vmin .4vmin 0 var(--border-color);z-index:10;margin:0}#shadow-area{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;padding:12vmin 5vmin 2vmin 5vmin;z-index:10;gap:5vmin}.shadow-slot{width:18vmin;height:18vmin;display:flex;justify-content:center;align-items:center;font-size:13vmin;line-height:1;transition:transform 0.3s cubic-bezier(.175,.885,.32,1.275);filter:drop-shadow(0 1.5vmin 1.5vmin rgb(0 0 0 / .25))}.is-shadow{filter:brightness(0) opacity(.3) drop-shadow(0 0 0 transparent)!important}#drag-area{height:28vmin;background:rgb(241 245 249 / .95);border-top:.8vmin solid var(--border-color);box-shadow:0 -1vmin 2vmin rgb(0 0 0 / .1);display:flex;justify-content:center;align-items:center;gap:4vmin;z-index:20;padding:0 5vmin;flex-wrap:wrap}.draggable-item{width:14vmin;height:14vmin;background:#fff;border:.6vmin solid var(--border-color);border-radius:2.5vmin;box-shadow:0 1.2vmin 0 var(--border-color);display:flex;justify-content:center;align-items:center;font-size:10vmin;cursor:grab;touch-action:none;user-select:none;z-index:2}#discovery-banner{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:var(--c-yellow);padding:2vmin 6vmin;border-radius:4vmin;border:.6vmin solid var(--border-color);box-shadow:0 1vmin 0 var(--border-color);font-size:5vmin;color:var(--text-color);z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgb(30 41 59 / .95);display:flex;justify-content:center;align-items:center;z-index:200;opacity:1;transition:opacity 0.3s}.modal-overlay.hidden{opacity:0;pointer-events:none}.modal-box{background:#fff;padding:5vmin;border-radius:4vmin;border:.8vmin solid var(--border-color);box-shadow:0 2vmin 0 rgb(0 0 0 / .3);text-align:center;max-width:600px;width:85%}#start-modal{background:var(--bg-main)}#start-modal .modal-box{background:#fff0;border:none;box-shadow:none}.action-btn{font-family:'Fredoka One',cursive;font-size:4.5vmin;padding:2.5vmin 7vmin;margin-top:3vmin;background-color:var(--c-green);color:#fff;border:.6vmin solid var(--border-color);border-radius:4vmin;cursor:pointer;box-shadow:0 1vmin 0 #16a34a;transition:transform 0.1s}.action-btn:active{transform:translateY(1vmin);box-shadow:0 0 0 #16a34a}.btn-danger{background-color:var(--c-red);box-shadow:0 1vmin 0 #b91c1c}.btn-danger:active{box-shadow:0 0 0 #b91c1c}.sticker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2.5vmin;margin:4vmin 0}.sticker-slot{width:12vmin;height:12vmin;background:#E2E8F0;border-radius:50%;border:.4vmin dashed #94A3B8;display:flex;justify-content:center;align-items:center;font-size:6vmin;filter:grayscale(1);opacity:.4}.sticker-slot.unlocked{background:#FEF08A;border:.4vmin solid #EAB308;filter:none;opacity:1;box-shadow:0 .5vmin 1.5vmin rgb(234 179 8 / .5);transform:scale(1.1)}.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:2vmin;margin-top:3vmin}.num-btn{padding:3vmin;font-family:'Fredoka One';font-size:5vmin;border-radius:2vmin;border:.5vmin solid var(--border-color);background:#fff;cursor:pointer;box-shadow:0 .8vmin 0 var(--border-color);transition:transform 0.1s}.num-btn:active{transform:translateY(.8vmin);box-shadow:0 0 0 var(--border-color)}.magic-star{position:absolute;pointer-events:none;z-index:350;opacity:0}
    </style>
</head>
<body>
<div id="app-layout">
    <header id="ui-header">
        <h1 class="logo">Shadow <span>Match</span></h1>
        <div class="header-actions">
            <div class="level-badge">Level: <span id="level-text">1</span> / 50</div>
            <button class="btn-round" id="btn-achievements" title="Achievements" style="background: var(--c-yellow);">🏆</button>
            <button class="btn-round" id="btn-sound" title="Toggle Sound">🔊</button>
        </div>
    </header>
    <main id="workspace">
        <div id="theme-overlay"></div>
        <h2 id="theme-title">Theme</h2>
        <div id="discovery-banner">Ready?</div>
        
        <div id="shadow-area"></div>
        <div id="drag-area"></div>
    </main>
</div>
<div id="start-modal" class="modal-overlay">
    <div class="modal-box">
        <h1 style="font-size: 10vmin; color: var(--c-blue); margin: 0 0 -2vmin 0; -webkit-text-stroke: 0.3vmin var(--border-color); text-shadow: 0.8vmin 0.8vmin 0 var(--border-color);">Shadow</h1>
        <h1 style="font-size: 9vmin; color: var(--c-pink); margin: 0 0 6vmin 0; -webkit-text-stroke: 0.3vmin var(--border-color); text-shadow: 0.8vmin 0.8vmin 0 var(--border-color);">Match!</h1>
        <button class="action-btn" id="btn-start" style="font-size: 6vmin; padding: 3vmin 10vmin;">PLAY!</button>
    </div>
</div>
<div id="success-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h1 style="font-size: 7vmin; color: var(--c-green); margin: 0 0 2vmin 0;">Great Job! 🌟</h1>
        <div id="sticker-alert" style="display:none; font-family:'Quicksand'; font-size:3.5vmin; color:var(--c-orange); font-weight:bold; margin-bottom:3vmin;">New Sticker Unlocked! 🏆</div>
        <button class="action-btn" id="btn-next-level">Next</button>
    </div>
</div>
<div id="achievements-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width: 800px;">
        <h1 style="color:var(--c-orange); margin:0 0 1vmin 0; font-size: 6vmin;">Sticker Album 🏆</h1>
        <p style="font-family:'Quicksand'; font-weight:600; font-size: 3vmin; margin: 0;">Complete levels to unlock!</p>
        <div class="sticker-grid" id="sticker-grid"></div>
        <button class="action-btn" id="btn-close-achievements" style="margin-right: 2vmin;">Close</button>
        <button class="action-btn btn-danger" id="btn-trigger-reset">Reset</button>
    </div>
</div>
<div id="parental-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2 style="margin:0 0 1vmin 0; color:var(--c-purple); font-size: 5vmin;">Parents Only</h2>
        <p style="font-family:'Quicksand'; font-weight:700; margin-bottom:3vmin; font-size: 3vmin; color: var(--c-red);">Solve to RESET progress:</p>
        <div id="math-question" style="font-size: 8vmin; font-weight: bold; background: #F1F5F9; border-radius: 2vmin; padding: 2vmin;">? + ? = </div>
        <div class="numpad" id="numpad"></div>
        <button class="action-btn" id="btn-close-parent" style="background:var(--border-color); box-shadow: 0 1vmin 0 #0f172a; margin-top: 4vmin;">Cancel</button>
    </div>
</div>
