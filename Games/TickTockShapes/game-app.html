<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tick-Tock Shapes</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
       :root{--border-color:#0F172A;--text-color:#1E293B;--clock-bg:rgba(255, 243, 199, 0.9);--clock-border:#F59E0B;--c-green:#10B981;--c-blue:#3B82F6;--c-orange:#F97316;--c-pink:#EC4899;--c-purple:#8B5CF6}body{margin:0;padding:0;background-color:#7DD3FC;font-family:'Fredoka One',cursive;display:flex;flex-direction:column;align-items:center;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:0}#sky-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:-3;background-color:#7DD3FC}.stars{position:absolute;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(white 2px,transparent 2px);background-size:60px 60px;opacity:0;z-index:-2}.stars::before{content:'';position:absolute;top:20px;left:20px;width:100%;height:100%;background-image:radial-gradient(rgb(255 255 255 / .5) 1px,transparent 1px);background-size:40px 40px}#celestial-pivot{position:absolute;bottom:-20vmin;left:50%;width:140vmin;height:140vmin;margin-left:-70vmin;border-radius:50%;z-index:-1}.celestial-body{position:absolute;width:18vmin;height:18vmin;left:50%;margin-left:-9vmin;font-size:14vmin;line-height:18vmin;text-align:center;filter:drop-shadow(0 0 3vmin rgb(255 255 255 / .6));display:flex;justify-content:center;align-items:center}#the-sun{top:-9vmin}#the-moon{bottom:-9vmin}header{width:100%;padding:1.5vmin 3vmin;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;background:rgb(255 255 255 / .85);backdrop-filter:blur(5px);box-shadow:0 .5vmin 1vmin rgb(0 0 0 / .1);z-index:50}.logo{font-size:3.5vmin;color:var(--c-blue);margin:0;text-shadow:.2vmin .2vmin 0 var(--border-color)}.logo span{color:var(--c-orange)}.top-ui{display:flex;gap:2vmin;align-items:center}.btn-round{width:6.5vmin;height:6.5vmin;border-radius:50%;border:.4vmin solid var(--border-color);background:#fff;font-size:3vmin;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:0 .5vmin 0 var(--border-color);transition:transform 0.1s}.btn-round:active{transform:translateY(.5vmin);box-shadow:0 0 0 var(--border-color)}#game-area{display:flex;flex-direction:row;flex-grow:1;width:100%;max-width:1200px;padding:2vmin;box-sizing:border-box;gap:2vmin;z-index:10}#clock-container{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}.target-wrapper{display:flex;gap:2vmin;align-items:center;margin-bottom:3vmin;opacity:0;transition:opacity 0.5s;pointer-events:none}#btn-reset-puzzle{width:8vmin;height:8vmin;border-radius:50%;border:.5vmin solid var(--border-color);background:linear-gradient(135deg,#22c55e 0%,#15803d 100%);color:#fff;font-size:4vmin;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:inset 0 .5vmin 1vmin rgb(255 255 255 / .4),0 .8vmin 0 #166534,0 1vmin 2vmin rgb(0 0 0 / .15);transition:transform 0.1s,box-shadow 0.1s;text-shadow:0 .2vmin .4vmin rgb(0 0 0 / .3);position:relative;overflow:hidden}#btn-reset-puzzle::before{content:'';position:absolute;top:.3vmin;left:10%;width:80%;height:35%;border-radius:4vmin 4vmin 2vmin 2vmin;background:linear-gradient(to bottom,rgb(255 255 255 / .5) 0%,#fff0 100%)}#btn-reset-puzzle:active{transform:translateY(.8vmin);box-shadow:inset 0 .5vmin 1vmin rgb(255 255 255 / .2),0 0 0 #166534}#target-display{font-size:6vmin;color:var(--text-color);background:#fff;padding:1vmin 4vmin;border-radius:3vmin;border:.5vmin solid var(--border-color);box-shadow:0 .8vmin 0 var(--border-color);display:flex;align-items:center;gap:1.5vmin}#btn-real-time{font-family:'Fredoka One';font-size:3vmin;padding:1.5vmin 3vmin;background:var(--c-purple);color:#fff;border:.4vmin solid var(--border-color);border-radius:2vmin;cursor:pointer;box-shadow:0 .8vmin 0 #6D28D9}#btn-real-time:active{transform:translateY(.8vmin);box-shadow:0 0 0 #6D28D9}.clock-face{width:60vmin;height:60vmin;background:var(--clock-bg);backdrop-filter:blur(5px);border-radius:50%;border:1.5vmin solid var(--clock- One';font-size:4vmin;padding:2vmin 5vmin;background:var(--c-green);color:#fff;border:.5vmin solid var(--border-color);border-radius:3vmin;cursor:pointer;box-shadow:0 1vmin 0 #059669;opacity:0;pointer-events:none;transition:opacity 0.5s}#btn-check:active{transform:translateY(1vmin);box-shadow:0 0 0 #059669}#win-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgb(15 23 42 / .8);display:flex;justify-content:center;align-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s}.modal-box{background:#fff;padding:5vmin;border-radius:4vmin;border:.8vmin solid var(--border-color);box-shadow:0 2vmin 0 rgb(0 0 0 / .3);text-align:center}.modal-box h1{font-size:6vmin;color:var(--c-orange);margin:0 0 1vmin 0}.modal-box p{font-family:'Quicksand';font-size:3vmin;color:var(--text-color);margin:0 0 3vmin 0;font-weight:700}.action-btn{font-family:'Fredoka One';font-size:4vmin;padding:2vmin 6vmin;background:var(--c-blue);color:#fff;border:.5vmin solid var(--border-color);border-radius:3vmin;cursor:pointer;box-shadow:0 1vmin 0 #2563EB}@media (max-aspect-ratio:1/1){#game-area{flex-direction:column;align-items:center}#palette{width:100%;height:20vh;flex-direction:row}.clock-face{width:80vmin;height:80vmin}}
    </style>
</head>
<body>
    <div id="sky-bg"></div>
    <div class="stars" id="stars"></div>
    <div id="celestial-pivot">
        <div class="celestial-body" id="the-sun">☀️</div>
        <div class="celestial-body" id="the-moon">🌙</div>
    </div>
    <header id="main-header">
        <h1 class="logo">Tick-Tock <span>Shapes</span></h1>
        <div class="top-ui">
            <button class="btn-round" id="btn-sound">🔊</button>
        </div>
    </header>
    <div id="game-area">
        <div id="clock-container">
            <div class="target-wrapper" id="target-wrapper">
                <button id="btn-reset-puzzle" title="Restart Puzzle">
    <svg viewBox="0 0 24 24" width="4.5vmin" height="4.5vmin" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0.2vmin 0.2vmin rgba(0,0,0,0.2));">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
    </svg>
	</button>
                <div id="target-display">
                    <span id="target-time-text">00:00</span>
                    <span id="target-icon">☀️</span>
                </div>
                <button id="btn-real-time">Real Time!</button>
            </div>          
            <div class="clock-face" id="clock-face">
                <div id="hands-container">
                    <div id="hour-hand" class="hand" data-type="hour"></div>
                    <div id="minute-hand" class="hand" data-type="minute"></div>
                    <div class="center-pin"></div>
                </div>
            </div>
            <button id="btn-check">TICK! ✔️</button>
        </div>       
        <div id="palette"></div>
    </div>
    <div id="win-modal">
        <div class="modal-box">
            <h1>Perfect Time! 🌟</h1>
            <p id="level-indicator">Level 1</p>
            <button class="action-btn" id="btn-next">Next Time</button>
        </div>
    </div>
